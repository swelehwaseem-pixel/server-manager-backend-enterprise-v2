events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    log_format server_json_metrics escape=json '{'
        '"time_local":"$time_local",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log server_json_metrics;
    error_log /var/log/nginx/error.log warn;
    server_tokens off;

    client_max_body_size 50M;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 30s;

    map $request_uri $block_malicious_probes {
        default 0;
        "~*wp-admin" 1;
        "~*phpmyadmin" 1;
        "~*\.env" 1;
        "~*metadata" 1;
    }

    limit_req_zone $binary_remote_addr zone=ip_req_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=ip_conn_limit:10m;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /nginx_status {
            stub_status;
            access_log off;
            allow 172.16.0.0/12;
            allow 172.17.0.0/16;
            allow 172.18.0.0/16;
            deny all;
        }

        location / {
            if ($block_malicious_probes) { return 444; }
            limit_conn ip_conn_limit 10;
            limit_req zone=ip_req_limit burst=20 nodelay;

            proxy_pass http://server-manager-backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        location ~* /(api/v1/metrics/live|api/v1/services/stream/|api/v1/oracle/admin/) {
            if ($block_malicious_probes) { return 444; }
            proxy_pass http://server-manager-backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ /\. {
            deny all;
        }
    }
}
