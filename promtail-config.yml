server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: systemd-journal-logs
    journal:
      max_age: 12h
      path: /var/log/journal
      labels:
        job: systemd-logs
    relabel_configs:
      - source_labels: ["__journal__systemd_unit"]
        target_label: systemd_unit
